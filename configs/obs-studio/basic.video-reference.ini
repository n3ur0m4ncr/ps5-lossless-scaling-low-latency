; ============================================================================
; OBS Studio x64 — Referência Sanitizada de Vídeo e Captura (SEM TOKENS/AUTH)
; Caminho de referência: %APPDATA%\obs-studio\basic\profiles\<Seu_Perfil>\basic.ini
;
; AVISO DE SEGURANÇA:
; NUNCA substitua seu basic.ini inteiro sem preservar suas configurações locais
; e JAMAIS versione credenciais de conta, chaves de live ou service.json!
; Copie apenas os parâmetros abaixo da seção [Video] e valide as propriedades
; da fonte única "Dispositivo de Captura de Vídeo" (dshow_input) na cena.
;
; REGRAS CRÍTICAS PARA MODO LIVE 30 -> 60 FPS (LSFG 3.1):
; 1. Canvas e Saída em 1920x1080 com FPSCommon=30 (30/1).
;    NÃO use 60 FPS para jogos nativos de 30 FPS do PS5: o HDMI 60 Hz entrega
;    pares duplicados (A, A, B, B) e força o LSFG 2x a gerar 60/120 com judder!
; 2. Mantenha APENAS UMA fonte DirectShow apontando para a UGREEN 15390 em toda
;    a coleção de cenas. Fontes duplicadas causam erro 0x800705AA no barramento USB.
; 3. Parâmetros obrigatórios dentro da propriedade da Fonte dshow_input (OBS UI):
;    - Dispositivo:            UGREEN 15390
;    - Tipo de Resolução/FPS:  Personalizado
;    - Resolução:              1920x1080
;    - FPS:                    30 (intervalo DirectShow: 333333 [100ns])
;    - Formato de Vídeo:       YUY2 (não-comprimido 4:2:2 via USB 3.0)
;    - Espaço de Cor / Faixa:  Rec. 709 / Parcial (alinhado ao RGB Limitado/YCbCr PS5)
;    - Buffering:              Desativado (CRÍTICO: reduz ~16-33 ms de fila no OBS!)
;    - Modo de Saída de Áudio: Capturar apenas áudio + Dispositivo personalizado:
;                              "Interface de áudio digital (UGREEN 15390)"
;                              (Em Propriedades de Áudio Avançadas: Monitorar e Enviar Saída)
; ============================================================================

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=30
FPSInt=30
FPSNum=30
FPSDen=1
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial
SdrWhiteLevel=300
HdrNominalPeakLevel=1000

[Audio]
MonitoringDeviceName=default
SampleRate=48000
ChannelSetup=Stereo
MeterDecayRate=23.53
PeakMeterType=0

[Output]
Mode=Simple
FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss
DelayEnable=false
Reconnect=true
RetryDelay=2
MaxRetries=25
BindIP=default
LowLatencyEnable=false

[SimpleOutput]
FilePath=%USERPROFILE%\\Videos
RecFormat2=hybrid_mp4
VBitrate=6000
ABitrate=160
UseAdvanced=false
NVENCPreset2=p5
RecQuality=Stream
RecRB=false
StreamAudioEncoder=aac
RecAudioEncoder=aac
StreamEncoder=nvenc
RecEncoder=nvenc
