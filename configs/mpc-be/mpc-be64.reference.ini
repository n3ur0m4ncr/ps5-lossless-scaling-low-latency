; ============================================================================
; MPC-BE x64 (1.9.3+) — Configuração de Referência Sanitizada de Baixa Latência
; Caminho padrão (modo INI local): %LOCALAPPDATA%\Programs\MPC-BE\mpc-be64.ini
;
; PARÂMETROS CRÍTICOS DESTE PERFIL:
; 1. [Video] VideoRenderer=3 (EVR Custom Presenter / EVR-CP)
;    - EVRBuffers=4 (mínimo estável sem starvation em DirectShow tempo real)
;    - VSync=0, VSyncInternal=0 (zero espera por blanking vertical)
;    - ExclusiveFullscreen=0 (permite DWM Independent Flip + captura DXGI do LSFG)
;    - FrameTimeCorrection=0, FlushGPU*=0 (sem bloqueio de pipeline CPU/GPU)
; 2. [Audio] AudioRenderer=MPC Audio Renderer (WASAPI baixa latência, TimeShift=0)
; 3. [Capture] UGREEN 15390 (MacroSilicon MS2131 - VID_345F&PID_2131):
;    - VidFormat codifica uma struct DirectShow VIDEOINFOHEADER (88 bytes) exata para:
;      * Resolução: 1920 x 1080 (biWidth=1920, biHeight=1080, biPlanes=1, biBitCount=16)
;      * Subtipo:   YUY2 4:2:2 não-comprimido (biCompression='YUY2', biSizeImage=4147200)
;      * Taxa:      30.000 FPS (AvgTimePerFrame=333333 [unidades de 100 ns], dwBitRate=995328000 bps)
;      ATENÇÃO: AvgTimePerFrame=166666 corresponde a 60 FPS e causa o bug 60/120 de quadros duplicados!
;    - AudDispName e VidDispName contêm placeholders (<SEU_...>) pois o hash de porta USB
;      varia em cada máquina; selecione a UGREEN 15390 uma vez via Ctrl+V no MPC-BE.
; ============================================================================

[Audio]
AudioFilters=0
AudioRenderer=MPC Audio Renderer
AudioRenderer2=
AutoVolumeControl=0
Balance=0
BassRedirect=0
DualAudioOtput=0
EnableTimeShift=0
Filter1=
FiltersDisableForStereo=0
Gain=0.0000
LevelCenter=0.0000
LevelSurround=0.0000
Mixer=0
MixerLayout=2.0
Mute=0
NormBoost=1
NormLevel=75
NormRealeaseTime=8
SampleFormats=30
StereoFromDecoder=0
TimeShift=0
Volume=100

[Capture]
AudDispName=@device:cm:{33D9A762-90C8-11D0-BD43-00A0C911CE86}\wave:{<SEU_GUID_ENDPOINT_WASAPI_UGREEN>}
AudFormat=AQACAESsAAAQsQIABAAQAAAA
AudOutput=1
AudPreview=1
Country=1
FileFormat=0
FileName=%USERPROFILE%\Videos\MPC-BE Capture\mpc-be64_capture_[time].avi
SepAudio=0
VidDispName=@device:pnp:\\?\usb#vid_345f&pid_2131&mi_00#<SEU_INSTANCE_ID_PORTA_USB3>#{65e8773d-8f56-11d0-a3b9-00a0c9223196}\global
; VIDEOINFOHEADER (88 bytes Base64): 1920x1080 | YUY2 | AvgTimePerFrame=333333 (30.000 FPS) | dwBitRate=995328000
VidFormat=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgFM7AAAAABUWBQAAAAAAKAAAAIAHAAA4BAAAAQAQAFlVWTIASD8AAAAAAAAAAAAAAAAAAAAAAA==
VidOutput=1
VidPreview=1

[OSD]
Border=1
FileName=0
Font=Segoe UI
FontAA=1
FontColor=0xE0E0E0
FontShadow=0
GradColor1=0x302820
GradColor2=0x302820
LocalTime=0
RemainingTime=0
ShowOSD=0
Size=18
Transparent=100

[Settings]
